<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="de.flk.Tandem.Daemon"/>
    <allow own="de.flk.Tandem"/>
    <allow send_destination="de.flk.Tandem.Daemon"/>
    <allow receive_sender="de.flk.Tandem.Daemon"/>
  </policy>
</busconfig>
